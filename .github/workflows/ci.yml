name: ci

# Every push to main and every pull request runs the same three gates a release
# runs, so a tag push is never the first time the suite is executed. No secrets:
# nothing here needs a credential.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # A test that leaks a live socket keeps the child process alive after every test
    # has finished. Without a bound, that run hangs until GitHub's six-hour default
    # and the log ends with no failing test to blame — which is what happened on
    # 2026-10-21. A job timeout turns that class of bug into a bounded, visible fail.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check entry syntax
        run: npm run check:syntax
      - name: Run tests
        run: npm test
      - name: Check package contents
        run: npm pack --dry-run
